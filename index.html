<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Something for you 💌</title>
<style>
:root{--bg:#fff1f3;--card:#ffffff;--ink:#3b1f2b;--soft:#8a5a6b;--accent:#e8456b;--accent2:#ff8fa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1017;--card:#2a1822;--ink:#ffe8ee;--soft:#d9a3b3;--accent:#ff6b8e;--accent2:#c2415f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1017;--card:#2a1822;--ink:#ffe8ee;--soft:#d9a3b3;--accent:#ff6b8e;--accent2:#c2415f;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:min(92%,420px);text-align:center;position:relative}
.card{background:var(--card);border-radius:24px;padding:36px 26px;box-shadow:0 12px 40px rgba(232,69,107,.18);min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px}
h1{font-size:1.7rem;margin:0;line-height:1.3}
p{margin:0;font-size:1.15rem;line-height:1.5;color:var(--soft)}
.big{font-size:3.2rem}
button{font-family:inherit;font-size:1.05rem;border:0;border-radius:999px;padding:13px 26px;background:var(--accent);color:#fff;cursor:pointer;transition:transform .15s}
button:active{transform:scale(.95)}
button.alt{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.dots{margin-top:18px;display:flex;gap:8px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--accent2);opacity:.35}
.dots i.on{opacity:1}
.fade{animation:f .6s ease}
@keyframes f{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.heart{position:absolute;bottom:-30px;animation:up 3.5s linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh);opacity:0}}
.pulse{animation:p 1.4s infinite}
a.btn{display:inline-block;text-decoration:none;font-size:1.05rem;border-radius:999px;padding:13px 26px;background:var(--accent);color:#fff}
@keyframes p{50%{transform:scale(1.15)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card fade" id="card"></div>
  <div class="dots" id="dots"></div>
</div>
<script>
// Defaults to Tasha. A different name at the end of the link (...#Amina) overrides it.
var raw = decodeURIComponent((location.hash || "").slice(1)).replace(/[_-]/g, " ").trim();
var name = raw || "Tasha";

var steps = [
  {big:"💌", title:"Hey " + name + "…", text:"I made you something. Tap to open it.", btn:"Open it"},
  {big:"🥺", title:"First thing", text:"Your smile makes a bad day feel like it never happened.", btn:"Aww, keep going"},
  {big:"🙈", title:"Second thing", text:"Best friends are rare, and somehow I got the best one, even with all these miles between us.", btn:"Okay, I’m listening"},
  {big:"😳", title:"Third thing", text:"Honestly, you’ve been on my mind way more than I planned.", btn:"Wait… what? 😳"},
  {big:"🫣", title:"One last surprise", text:"Ready for it?", btn:"Show me", reveal:true}
];
var i = 0;
var card = document.getElementById("card");
var dots = document.getElementById("dots");

function render(){
  var s = steps[i];
  dots.innerHTML = steps.map(function(_, k){ return "<i class='" + (k <= i ? "on" : "") + "'></i>"; }).join("");
  card.className = "card fade";
  void card.offsetWidth;
  card.innerHTML = "<div class='big" + (s.reveal ? " pulse" : "") + "'>" + s.big + "</div><h1>" + s.title + "</h1><p>" + s.text + "</p><button id='next'>" + s.btn + "</button>";
  document.getElementById("next").onclick = function(){
    hearts(5);
    if (s.reveal) { finale(); } else { i++; render(); }
  };
}

function finale(){
  dots.innerHTML = "";
  card.className = "card fade";
  card.innerHTML = "<div class='big'>👉👈</div><h1>Video call this weekend? Just us?</h1><p>Coffee on your side, chai on mine. ☕</p><div class='row'><button id='yes'>Yes 😊</button><button class='alt' id='maybe'>Let me think 😏</button></div>";
  document.getElementById("yes").onclick = function(){
    hearts(24);
    card.innerHTML = "<div class='big'>🎉</div><h1>Yay!</h1><p>One last tap so I know. 😉</p>" + waBtn("Yes! Video call this weekend 😊 – " + name);
  };
  document.getElementById("maybe").onclick = function(){
    card.innerHTML = "<div class='big'>🙈</div><h1>Take your time…</h1><p>But not too long. 😉</p>" + waBtn("Hmm, let me think about it 🙈 – " + name); return;
    this.disabled = true;
  };
}

var MY_NUMBER = "254758796040";
function waBtn(msg){
  return "<a class='btn' href='https://wa.me/" + MY_NUMBER + "?text=" + encodeURIComponent(msg) + "'>Send my answer 💬</a>";
}

function hearts(n){
  for (var k = 0; k < n; k++){
    var h = document.createElement("div");
    h.className = "heart";
    h.textContent = ["💖","💗","💕","🥺","🙈"][k % 5];
    h.style.left = Math.random() * 100 + "%";
    h.style.fontSize = (18 + Math.random() * 22) + "px";
    h.style.animationDelay = (Math.random() * .6) + "s";
    document.querySelector(".wrap").appendChild(h);
    setTimeout(function(el){ el.remove(); }, 4500, h);
  }
}

render();
</script>
</body>
</html>
